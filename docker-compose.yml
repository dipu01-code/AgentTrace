# Backend + MongoDB. Run: JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: agenttrace
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
